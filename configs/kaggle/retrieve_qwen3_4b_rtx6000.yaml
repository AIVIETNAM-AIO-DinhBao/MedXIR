# Step 2 of retrieval: exact search over the stored Qwen3-Embedding-4B vectors. No model is loaded here;
# query vectors come from the encode kernel. Set the RTX Pro 6000 option via machine_shape.
kernel:
  id: boinhbo/medxir-retrieve-qwen3-4b
  title: medxir retrieve qwen3 4b
  code_file: src/notebooks/kaggle_search_4b.ipynb
  kernel_type: notebook
  enable_gpu: true
  enable_internet: false
  machine_shape: NvidiaRtxPro6000
  expected_hardware_contains: "6000"
  competition_sources: [arc-prize-2026-arc-agi-3]
  kernel_sources: [boinhbo/medxir-chunk-corpus, boinhbo/medxir-encode-queries-4b]
  dataset_sources:
    - boinhbo/medxir-vectors-qwen3-4b-s0
    - boinhbo/medxir-vectors-qwen3-4b-s1
    - boinhbo/medxir-vectors-qwen3-4b-s2
    - boinhbo/medxir-retrieval-inputs
  timeout_seconds: 21600
  poll_interval_seconds: 120
  fetch_files:
    - progress.txt
    - faulthandler.txt
    - retrieval_manifest.json
    - medxir-qwen3-4b-submission.json
    - medxir-qwen3-4b-submission.zip
  required_outputs:
    - retrieval_manifest.json
    - medxir-qwen3-4b-submission.json
    - medxir-qwen3-4b-submission.zip
  metrics_file: retrieval_manifest.json
