# Hybrid retrieval (scripts/build_hybrid_notebook.py): query variants, dense search, PRF, BM25, rerank, submission.
# Switches are in the notebook's first code cell. RTX Pro 6000 is offered only with the competition attached
# and Internet OFF. Baseline vector outputs plus the additions dataset are read with mmap in blocks.
# Share the two private ntklinhfitus datasets with boinhbo before running this config.
kernel:
  id: boinhbo/medxir-hybrid-retrieval
  title: medxir hybrid retrieval
  code_file: src/notebooks/kaggle_hybrid_retrieval.ipynb
  kernel_type: notebook
  enable_gpu: true
  enable_internet: false
  machine_shape: NvidiaRtxPro6000
  expected_hardware_contains: "6000"
  competition_sources: [arc-prize-2026-arc-agi-3]
  kernel_sources:
    - boinhbo/medxir-package-models
    - boinhbo/medxir-embed-corpus-4b-s0
    - boinhbo/medxir-embed-corpus-4b-s1
    - boinhbo/medxir-embed-corpus-4b-s2
    - ntklinhfitus/medxir-bm25-vi-v2
    - boinhbo/medxir-package-rerankers
  dataset_sources:
    - boinhbo/medxir-retrieval-inputs
    - ntklinhfitus/medxir-chunk-corpus-v2
    - ntklinhfitus/medxir-vectors-qwen3-4b-additions
  timeout_seconds: 21600
  poll_interval_seconds: 120
  metrics_file: hybrid_manifest.json
  fetch_files:
    - progress.txt
    - faulthandler.txt
    - hybrid_manifest.json
    - query_variants.json
    - pool.parquet
    - medxir-hybrid-submission.zip
    - expand_manifest.json
    - doc_rank.parquet
    - medxir-expand-nb60-d200-submission.zip
    - medxir-expand-nb60-d200-drr-bge-submission.zip
    - medxir-expand-nb60-d200-drr-bge-only-submission.zip
  required_outputs:
    - hybrid_manifest.json
    - medxir-hybrid-submission.zip
