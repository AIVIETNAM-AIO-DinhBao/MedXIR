# RTX Pro 6000, Internet OFF: Qwen3-Embedding-4B, shard 0 of 3 over the 9 chunk parts (index % 3 == 0).
# Run the shards one after another: one GPU session at a time per account. Output ~4.5 GiB per shard.
kernel:
  id: boinhbo/medxir-embed-corpus-4b-s0
  title: medxir embed corpus 4b s0
  code_file: src/notebooks/kaggle_embed_corpus_4b_s0.ipynb
  kernel_type: notebook
  enable_gpu: true
  enable_internet: false
  machine_shape: NvidiaRtxPro6000
  kernel_sources: [boinhbo/medxir-chunk-corpus, boinhbo/medxir-package-models]
  timeout_seconds: 21600
  poll_interval_seconds: 300
  expected_hardware_contains: "6000"
  fetch_files: [embed_manifest.json]
  required_outputs: [embed_manifest.json]
