# RTX Pro 6000, Internet OFF: Qwen3-Embedding-0.6B over all chunks of medxir-corpus.
# machine_shape NvidiaRtxPro6000 is the RTX Pro 6000 value (read from the kernel saved in the UI).
# The notebook stops at once on any other GPU (EXPECT_GPU = '6000').
kernel:
  id: boinhbo/medxir-embed-corpus-06b
  title: medxir embed corpus 06b
  code_file: src/notebooks/kaggle_embed_corpus.ipynb
  kernel_type: notebook
  enable_gpu: true
  enable_internet: false
  machine_shape: NvidiaRtxPro6000
  kernel_sources: [boinhbo/medxir-chunk-corpus, boinhbo/medxir-package-models]
  timeout_seconds: 28800
  poll_interval_seconds: 300
  expected_hardware_contains: "6000"
  fetch_files: [embed_manifest.json]
  required_outputs: [embed_manifest.json]
