# CPU job: BM25 over the Vietnamese chunks (scripts/bm25_vi.py) of chunk corpus v2. Output feeds the hybrid
# notebook (BM25_CORPUS_VERSION = 'v2' there). v1 (kernel boinhbo/medxir-chunk-corpus) had 7 VI parts, v2 has 8.
# Runs as ntklinhfitus (owner of the v2 corpus); share the kernel with boinhbo so the hybrid notebook can attach it.
kernel:
  id: ntklinhfitus/medxir-bm25-vi-v2
  title: medxir bm25 vi v2
  code_file: src/notebooks/kaggle_bm25_vi.ipynb
  kernel_type: notebook
  enable_gpu: false
  enable_internet: false
  dataset_sources: [boinhbo/medxir-retrieval-inputs, ntklinhfitus/medxir-chunk-corpus-v2]
  timeout_seconds: 7200
  poll_interval_seconds: 60
  fetch_files: [vi-candidates-k500.npz, bm25_manifest.json]
  required_outputs: [vi-candidates-k500.npz, bm25_manifest.json]
