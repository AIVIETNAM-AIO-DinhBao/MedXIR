# Run the shards one after another: one GPU session at a time per account. Output ~7 GiB per shard.
kernel:
  id: boinhbo/medxir-embed-corpus-octen8b-s0
  title: medxir embed corpus octen8b s0
  code_file: src/notebooks/kaggle_embed_corpus_octen8b_s0.ipynb
  kernel_type: notebook
  enable_gpu: true
  enable_internet: false
  machine_shape: NvidiaRtxPro6000
  competition_sources: [arc-prize-2026-arc-agi-3]
  kernel_sources: [boinhbo/medxir-chunk-corpus, boinhbo/medxir-package-octen8b]
  timeout_seconds: 36000
  poll_interval_seconds: 600
  expected_hardware_contains: "6000"
  fetch_files: [embed_manifest.json]
  required_outputs: [embed_manifest.json]
